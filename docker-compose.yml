# Ports: frontend 1500, backend 1600, database 1700 (host side)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-interview_coach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-interview_coach}
      POSTGRES_DB: ${POSTGRES_DB:-interview_coach}
    ports:
      - "1700:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    # Values here take precedence over the root .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-interview_coach}:${POSTGRES_PASSWORD:-interview_coach}@db:5432/${POSTGRES_DB:-interview_coach}
      ALLOWED_ORIGINS: http://localhost:1500,http://127.0.0.1:1500
      PORT: "1600"
      DEBUG: "False"
    ports:
      - "1600:1600"
    volumes:
      - uploads:/app/uploads
      - reports:/app/reports
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:1600
    ports:
      - "1500:1500"
    depends_on:
      - backend

volumes:
  db_data:
  uploads:
  reports:
